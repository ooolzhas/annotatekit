name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    name: AnnotateCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v7
      - run: swift test

  ios:
    name: AnnotateKit (iOS Simulator, Debug + Release)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Xcode version
        run: xcodebuild -version
      - name: Core + CLI tests (macOS)
        run: swift test
      - name: CLI smoke test
        run: swift run annotate help
      # The default bash shell runs with pipefail, so xcodebuild failures survive the pipe
      - name: Build Debug (overlay compiled in)
        run: |
          xcodebuild build -scheme AnnotateKit -configuration Debug \
            -destination 'generic/platform=iOS Simulator' | xcbeautify
      - name: Build Release (stubs only)
        run: |
          xcodebuild build -scheme AnnotateKit -configuration Release \
            -destination 'generic/platform=iOS Simulator' | xcbeautify

  plugin:
    name: Claude Code plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @anthropic-ai/claude-code@2.1.312 plugin validate --strict .
      - name: Launcher script parses
        run: bash -n bin/annotate
