name: Bug report
description: Something in the overlay, the CLI or delivery doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Enter annotate mode on …\n2. Tap …\n3. …"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Overlay (selection / pins / drawing), Session bundle / prompt, annotate CLI, Delivery to an agent, Other]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Xcode 26.1, iOS 26.0 Simulator (iPhone 17 Pro), AnnotateKit 0.4.2, Claude Code 2.x"
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: session.json / prompt.md (optional)
      description: Redact anything private. Screenshots of the annotated screen help a lot.
      render: json
